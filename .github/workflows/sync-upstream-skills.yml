# この repo は skill を集めて配るだけのミラー。正は各 skill の repo。
#
# 配布元は決め打ちしない。OWNER の public repo を走査して
# `skills/<name>/SKILL.md` を持つものを配布元とみなし、repo 1 つを plugin 1 つにする。
# 新しい skill repo を作れば、次の実行から勝手に載る。
name: sync-upstream-skills

on:
  schedule:
    - cron: "0 21 * * 0" # 毎週月曜 06:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  OWNER: nogikun

defaults:
  run:
    shell: bash

concurrency:
  group: sync-upstream-skills

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 同期処理の回帰テスト
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: 配布元から plugins/ を作り直す
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/sync_plugins.py | tee "$RUNNER_TEMP/found.tsv"

      # sync が決めた名前・version を維持し、両クライアントの catalog を書き出す。
      - name: marketplace を書き出す
        run: npx -y github:nogikun/skill-mart#v1.0.0

      - name: PR の本文を組み立てる
        run: |
          set -euo pipefail
          {
            echo "配布元の \`skills/\` に入った変更。"
            echo "この repo はミラーなので、内容に異論が無ければそのままマージする。"
            echo
            echo "**中身を直したくなったら配布元で直す。** ここで直しても次回の同期で消える。"
            echo
            echo "## 今回見つかった配布元"
            echo
            echo "| plugin | 配布元 | skill |"
            echo "| --- | --- | --- |"
            awk -F'\t' '{printf "| `%s` | %s | %s |\n", $2, $1, $3}' "$RUNNER_TEMP/found.tsv"
            echo
            echo "README の表に無い skill が増えていたら、行を足してからマージする。"
          } > "$RUNNER_TEMP/pr-body.md"

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: sync-upstream-skills
          title: "chore: 配布元の skills と同期"
          commit-message: "chore: sync skills from upstream"
          body-path: ${{ runner.temp }}/pr-body.md
