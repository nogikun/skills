<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Active Reader</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <button id="nav-btn" class="icon" type="button" title="文書一覧の表示切替（⌘B / Ctrl+B）" aria-label="文書一覧"></button>
    <span id="title"></span>
    <button id="toc-btn" class="icon" type="button" title="目次" aria-label="目次"></button>
    <button id="panel-btn" class="icon" type="button" title="サイドパネルの表示切替（⌥⌘B / Ctrl+Alt+B）" aria-label="サイドパネル"></button>
  </header>
  <main>
    <nav id="nav">
      <form id="add">
        <input id="add-path" placeholder="ファイルのパスを入力して Enter" aria-label="開く文書のパス">
      </form>
      <ol id="docs"></ol>
      <button id="records-btn" class="link muted" type="button">記録を管理…</button>
    </nav>
    <article id="reader"></article>
    <nav id="toc" aria-label="目次"></nav>
    <aside id="panel">
      <div id="tabs" class="segmented" role="tablist">
        <button id="tab-marks" type="button" data-tab="marks" class="on">マーカー</button>
        <button id="tab-terms" type="button" data-tab="terms">用語</button>
      </div>
      <div id="caption" class="muted"></div>
      <ol id="list"></ol>
      <ol id="terms" hidden></ol>
    </aside>
  </main>
  <dialog id="records">
    <h2>記録を管理</h2>
    <p class="muted">削除されるのは読書記録だけです。元の文書は削除しません。</p>
    <div class="row">
      <input id="dir" placeholder="/path/to/project">
      <button id="del-dir" class="link danger" type="button">このフォルダ配下を削除</button>
    </div>
    <button id="clean" class="link" type="button">見つからない文書の記録を掃除</button>
    <table>
      <thead><tr><th>タイトル</th><th>パス</th><th>件数</th><th>最終更新</th><th></th></tr></thead>
      <tbody id="rec-rows"></tbody>
    </table>
    <form method="dialog"><button class="link">閉じる</button></form>
  </dialog>
  <script src="/static/app.js"></script>
</body>
</html>
