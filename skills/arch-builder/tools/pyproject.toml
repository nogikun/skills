# arch-builder のコード一式。SKILL.md / references/ / agents/ はモデルが読む文章なので、このパッケージには入れない。
#
#   uv run --project "<このスキルのディレクトリ>/tools" arch <サブコマンド>
#
# 呼び出しはこの形だけにする。uvx は使わない。uvx はビルド結果をキャッシュに固定するので、
# src を書き換えても古いコードのまま動いてしまう。
[project]
name = "arch-builder"
version = "0.1.0"
description = "AWS 構成図: arch.yaml (正本) と .drawio の生成・取り込み・編集・規約検証"
requires-python = ">=3.13"
dependencies = ["pyyaml>=6"]

[project.scripts]
arch = "arch_builder.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arch_builder"]

[tool.hatch.build]
artifacts = ["src/arch_builder/render.mjs"]

[tool.ruff]
line-length = 120
