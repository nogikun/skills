[project]
name = "scribe"
version = "0.1.0"
description = "Meeting transcription and speaker diarization CLI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "nogikun", email = "ok220075@oks.iput.ac.jp" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=14",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "sherpa-onnx>=1.13.8",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
# torch backends. Pick the torch build with ONE of cpu / cu128 (Windows, Linux).
# macOS always gets the PyPI build (CPU/MPS), so cpu/cu128 change nothing there.
#   uv sync --extra nemotron --extra cu128   # NVIDIA GPU
#   uv sync --extra nemotron --extra cpu     # no GPU
nemotron = ["transformers>=5.19", "torch>=2.7", "librosa"]
pyannote = ["pyannote.audio>=4.0", "torch>=2.7"]
cpu = ["torch>=2.7"]
cu128 = ["torch>=2.7"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
scribe = "scribe.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
